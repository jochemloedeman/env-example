name: "Run Tests"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group test

      - name: Run tests
        run: uv run pytest
